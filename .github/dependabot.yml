# Docs: <https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/customizing-dependency-updates>
#
# Added 2026-09-02. Until then **nothing watched this repo's dependencies** —
# prinny-client and prinny had a Dependabot config, this one did not, and the
# gap was not theoretical: the audit that prompted this file found vitest
# pinned at 2.1.9, carrying a critical (CVSS 9.8) arbitrary-file-read-and-
# execute advisory plus a high in vite, and eslint on a 9.x line where every
# published version is deprecated. Neither would have aged a day if this file
# had existed.
#
# There are no workflows in this repo yet, so no `github-actions` ecosystem is
# declared. Add one in the same change as the first workflow.
#
# Note that this file governs *version* updates only. Dependabot *security*
# updates are a repository setting — switch alerts and automated security
# fixes on for this repo too, as was done for prinny and prinny-client on
# 2026-08-11.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10
    ignore:
      # The package supports Node >= 20.11 (engines). Types from a newer Node
      # major type-check code against APIs that Node 20 and 22 do not have.
      # Raise this together with `engines`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (8.72) accepts typescript < 6.1 only, so TypeScript 7
      # breaks linting. Drop this once typescript-eslint supports 7
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
